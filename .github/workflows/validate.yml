name: Validate accuracy

# Replays past official rankings with our data and formula and reports how
# many teams match FIFA's published points. Read the job log for details.
on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py --verbose
