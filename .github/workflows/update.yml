name: Update rankings

on:
  schedule:
    - cron: "5 * * * *"   # every hour, at :05
  workflow_dispatch:
  push:
    paths:
      - data/manual_results.csv
      - scripts/update.py

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          # generatedAt always changes, so only commit when the rankings themselves move
          if git diff --quiet -I '"generatedAt"' -- data/rankings.json; then
            echo "No ranking changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          git commit -m "Update live rankings"
          git push
